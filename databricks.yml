# Databricks Asset Bundle entry point. Deployable jobs and Apps are kept in
# resources/ so this root file remains an easy-to-scan environment contract.
bundle:
  name: orderops_control_tower
  # Fail early when the local CLI is too old for the resource syntax below.
  databricks_cli_version: ">=0.283.0"

# Load the Lakeflow Job, both Apps, and the trace experiment.
include:
  - resources/*.yml

# Shared deployment inputs. Override a value with --var when a workspace uses a
# different catalog, warehouse, or model-serving endpoint.
variables:
  catalog_name:
    description: Existing Unity Catalog catalog created by the bootstrap notebooks.
    default: orderops
  sql_warehouse_id:
    description: ID of the existing Free Edition SQL warehouse.
    # Resolve the workspace-specific ID from a human-readable warehouse name.
    lookup:
      warehouse: Serverless Starter Warehouse
  llm_endpoint_name:
    description: Tool-capable Foundation Model API endpoint visible in AI Playground.
    default: databricks-meta-llama-3-1-8b-instruct

targets:
  dev:
    # Development mode isolates and labels resources for safe iteration.
    mode: development
    default: true
    workspace:
      # Each user receives an independent deployment beneath their workspace home.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
